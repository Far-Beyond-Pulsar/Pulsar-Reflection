[package]
name = "pulsar_reflection_codegen"
version = "0.1.0"
edition = "2021"
description = "Shared code generation for reflected-method attribute macros"

[dependencies]
syn = { workspace = true, features = ["full", "extra-traits"] }
quote = { workspace = true }
proc-macro2 = { workspace = true, features = ["proc-macro"] }
